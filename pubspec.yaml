name: lexora
description: "Your AI partner for smarter legal work."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: "none" # Remove this line if you wish to publish to pub.dev

version: 1.0.3+4

environment:
  sdk: ">=3.5.2 <4.0.0"

dependencies:
  connectivity_plus: ^7.0.0
  cupertino_icons: ^1.0.2
  dartz: ^0.10.1
  device_info_plus: ^11.3.0
  dio: ^5.4.0
  equatable: ^2.0.7
  flutter:
    sdk: flutter
  flutter_bloc: ^9.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_localizations:
    sdk: flutter
  flutter_native_splash: ^2.4.4
  flutter_screenutil: ^5.9.0
  flutter_secure_storage: ^9.2.4
  flutter_svg: ^2.0.9
  # font_awesome_flutter: ^10.9.1
  flutter_tts: ^4.2.3
  freezed_annotation: ^2.4.4
  get_it: ^8.0.3
  go_router: ^15.1.2
  google_fonts: ^6.3.0
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  hydrated_bloc: ^10.0.0
  injectable: ^2.5.0
  intl: any
  ionicons: ^0.2.2
  json_annotation: ^4.9.0
  open_file: ^3.5.10
  package_info_plus: ^9.0.0
  path_provider: ^2.1.5
  permission_handler: ^12.0.1
  pretty_dio_logger: ^1.4.0
  provider: ^6.1.1
  retrofit: ^4.5.0
  shimmer: ^3.0.0
  url_launcher: ^6.3.1

dev_dependencies:
  build_runner: ^2.4.13

  # Linting & Assets
  flutter_gen_runner: ^5.4.0
  flutter_lints: ^5.0.0
  flutter_test:
    sdk: flutter
  freezed: ^2.4.5 # MOVED HERE with stable version
  hive_generator: ^2.0.1
  injectable_generator: ^2.4.0 # ADDED - needed for injectable
  json_serializable: ^6.7.1
  retrofit_generator: ^9.1.5

flutter_native_splash:
  color: "#FFFFFF" # Background color
  image: assets/icons/logo-white.png # Path to your splash image
  android: true
  ios: true

flutter:
  generate: true
  uses-material-design: true

  assets:
    - assets/icons/
    - assets/
